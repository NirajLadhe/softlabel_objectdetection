# =============================================================================
# Assignment 4 - Task 3: LVIS training configuration
# All relative paths are resolved RELATIVE TO THIS FILE'S DIRECTORY (configs/).
# =============================================================================

DATA:
  DATASET: 'lvis'                       # registry name (adapters/datasets/__init__.py)
  ROOT: '/media/klee_ro/public_datasets/coco_lvis'
  LABEL_MODE: 'hard'                    # HARD-LABEL run (was 'soft_1d' for v5-v7)
  # resolve_label_file() reads LABEL_FILE first, so it must point at the hard file.
  LABEL_FILE: '../outputs/lvis/hard_labels/LVIS_HardLabels_val.json'
  HARD_LABEL_FILE: '../outputs/lvis/hard_labels/LVIS_HardLabels_val.json'
  # Legacy keys kept for backward-compat with older code paths:
  SOFT_LABEL_FILE_1D: '../outputs/lvis/1d_gaussian_softlabels/1DGMM_softLabels_iou0_5_with_priors.json'
  GMM_TYPE: 'HARD_LABEL'
  TEST_SPLIT_RATIO: 0.20
  BALANCED_SAMPLER: True
  OVERSAMPLE_FACTOR: 0.25               # V5 RFS threshold t (reverted from v7's 0.01).
  OPTIONS:
    image_subdir: 'val2017'             # subfolder of ROOT holding the .jpg files
    image_extension: '.jpg'
    rater_weights_csv: '../outputs/raters_reliability/annotator_reliability_lvis/annotator_reliability_scores_lvis_iou0_5.csv'

MODEL:
  NUM_CLASSES: 825                      # 824 distinct LVIS classes + 1 background
  BACKBONE: 'resnet50'
  PROBABILISTIC: False                  # HARD labels -> standard CE head (was True)
  ARCHITECTURE: ''                      # blank: factory routes on ARCHITECTURE first;
                                        # 'lvis_1d' would force the probabilistic head.
                                        # '' -> model_type='hard' -> get_model_1d(probabilistic=False).
  ROI_HEAD_BUFFER_FREQ_TERM: 'inverse_sqrt'   # gentler than 'inverse' for long-tail classes
  ROI_HEAD_BUFFER_MAX_WEIGHT: 7.0             # lowered 15->7: 15x weights inflated cls loss scale (~25) and stalled learning
  # Anchors re-computed via K-means on ALL-CLASS GT box pixel sizes (after model resize,
  # min_size=800/max_size=1333). 61,350 boxes; median GT sqrt-area=57px (vs 41px top-20).
  # Full set has larger objects than top-20 produce items -> sizes shifted up.
  # K-means on sqrt-area: [35,117,246,443,738]; K-means on w/h AR (clip [0.1,10]): [0.49,1.22,2.37,4.54,8.7]
  ANCHOR_SIZES: [[35], [117], [246], [443], [738]]
  ANCHOR_ASPECT_RATIOS: [[0.49, 1.22, 2.37, 4.54, 8.7]]

MISC:
  RUN_NAME: 'lvis_hardlabel_v1_resnet50'
  RESULTS_CSV: '../outputs/training_metric_logs'
  SAVE_MODEL_PATH: '../outputs/saved_models/lvis/1d_gaussian_softlabels'
  EVALUATION_RESULTS_DIR: '../outputs/lvis/1d_gaussian_softlabels/evaluation_results'
  PRETRAINED_WEIGHTS: ''
  # Freeze stem + layer1 + layer2; layer3/layer4 + FPN + RPN + heads train.
  # v1 (no freeze) overfitted from epoch 13, gap reached +3.4 by ep45 despite 3.8k images.
  # 374 rare classes (<10 boxes each) were being memorized by the backbone.
  FROZEN_LAYERS: ['backbone.body.conv1', 'backbone.body.bn1', 'backbone.body.layer1', 'backbone.body.layer2']
  NO_CUDA: False

TRAIN:
  BASE_LR_BBOX: 0.0001                  # V5 value (reverted from v7's 0.0005)
  BASE_LR_CLASS: 0.001                   # V5 value (reverted from v7's 0.0005)
  BASE_LR: 0.0005
  BOX_REG_LOSS_WEIGHT: 1.0
  SCHEDULER: 'secondary_scheduler'      # CosineAnnealingLR
  MILESTONES: [30, 38]                  # only used by 'main_scheduler'
  GAMMA: 0.5
  BATCH_SIZE: 1                         # batch_size=4 OOMs on anchor IoU (1.39 GiB alloc fails)
  OVERFIT_BATCHES: 0                    # SMOKE TEST: validate v6 (RFS t=0.001 + scale jitter). Set to 0 for full training.
  NUM_EPOCHS: 30                       # V5 value (reverted from v7's 45)
  EARLY_STOPPING: False                   # CompositeEarlyStopping1D (min 15 ep, patience 7) catches the plateau
  GRADIENT_CLIP_VAL: 35.0               # raised 5->35: 824-way weighted loss has large but legitimate grads; clip=5 throttled learning

LIGHTNING:
  ACCELERATOR: 'cuda'
  DEVICES: "auto" 
  #STRATEGY: ddp                   # 'ddp' for multi-GPU, 'auto' for single GPU or CP
  PRECISION: 32
  DETERMINISTIC: False
  NUM_SANITY_VAL_STEPS: 0
  ENABLE_CHECKPOINTING: True
  ENABLE_PROGRESS_BAR: True
  ACCUMULATE_GRAD_BATCHES: 1

AUGMENTATION:
  HORIZONTAL_FLIP_PROB: 0.5
  ROTATION_DEGREES: 15                  # V5 value (reverted from v7's 0)
  BRIGHTNESS_RANGE: (0.7, 1.3)
  CONTRAST_RANGE: (0.7, 1.3)
  NOISE_STD: 0.05
  RARE_CLASS_INDICES: []                # V5 value (reverted from v7's 543-class list)
  RARE_CLASS_AUGMENT_PROB: 0.8
  COMMON_CLASS_AUGMENT_PROB: 0.8