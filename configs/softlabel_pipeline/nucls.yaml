DATASET:
  name: "nucls"
  no_finding_labels: []          # NuCLS has no "No Finding" class
  no_finding_id: null            # no equivalent in NuCLS
  image_file_extension: ".png"   # NuCLS images are PNG
  annotator_id_col: "rad_id"
  image_id_col: "image_id"
  class_name_col: "class_name"
  absent_rater_vote: false       # raters see different FOVs — absence is not a negative vote
  image_id_key: "file_name"

PIPELINE:
  gmm_mode: "1d"
  clustering_method: "iou"
  iou_threshold: 0.25            # paper-validated threshold for nucleus-scale annotations
  iomin_threshold: 0.25
  center_ratio_threshold: 0.5
  iou_reliability: 0.25          # paper-validated for NuCLS
  prior_alpha: 1.0
  min_samples: 5
  semantic_map: null             # no NuCLS semantic map defined yet
  reliability_backend: "kalos"
  reliability_method: "shm"

PATHS:
  input_csv: "outputs/nucls/nucls_canonical.csv"
  output_dir: "outputs/nucls"
  reliability_dir: "outputs/nucls/reliability"
