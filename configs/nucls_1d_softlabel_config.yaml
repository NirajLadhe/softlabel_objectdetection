DATA:
  DATASET: 'nucls'
  ROOT: '/media/klee_ro/public_datasets/nucls'
  SOFT_LABEL_FILE_1D: '../outputs/nucls_transform_0.001/1d_gaussian_softlabels/1DGMM_softLabels_iou0_25_with_priors.json'
  # HARD_LABEL_FILE: '../outputs/nucls_transform_0.001/hard_labels/HardLabels_MajorityVote_iou0_25.json'
  GMM_TYPE: '1D'
  TEST_SPLIT_RATIO: 0.10
  VAL_SPLIT_RATIO: 0.10
  BALANCED_SAMPLER: True
  RFS_THRESHOLD: 0.25
  IGNORE_NOFINDING_IMAGES: False
  DOWNWEIGHT_NOFINDING_IMAGES: False
  NOFINDING_INCLUDE_FRACTION: 1.0
  OPTIONS:
    rater_weights_csv: '../outputs/nucls_transform_0.001/reliability/annotator_reliability_scores_nucls_iou0_25.csv'
    image_extension: '.png'

MODEL:
  NUM_CLASSES: 14
  BACKBONE: 'resnet50'
  PROBABILISTIC: True
  ROI_HEAD_BUFFER_FREQ_TERM: 'inverse'
  # Changed 3.0 → 15.0: VinDr uses 15.0 with same imbalance strategy
  # mitotic (2 training images) and myoepithelium (1) need maximum gradient weight
  ROI_HEAD_BUFFER_MAX_WEIGHT: 14.0
  ANCHOR_SIZES: [[8], [16], [32], [64], [128]]
  ANCHOR_ASPECT_RATIOS: [[0.5,0.75,1.0,1.5,2.0]]

MISC:
  RUN_NAME: 'nucls_softlabels_transform_0001_200epochs_soft_transform_13'
  RESULTS_CSV: '../outputs/nucls_transform_0.001/training_metric_logs'
  SAVE_MODEL_PATH: '../outputs/saved_models/nucls_transform_0.001/1d_gaussian_softlabels'
  EVALUATION_RESULTS_DIR: '../outputs/nucls_transform_0.001/1d_gaussian_softlabels/evaluation_results'
  PRETRAINED_WEIGHTS: ''
  # Freeze layers [1,2] — low-level feature detectors already learned from ImageNet
  # Reduces overfitting risk on 162 images
  # Revert to [] if val loss stagnates in first 10 epochs
  FROZEN_LAYERS: ['layer1']
  NO_CUDA: False

TRAIN:
  BASE_LR_BBOX: 0.00015
  BASE_LR_CLASS: 0.00015
  BASE_LR: 0.00015
  BOX_REG_LOSS_WEIGHT: 1.0
  SCHEDULER: 'secondary_scheduler'
  MILESTONES: [60,100, 130]
  GAMMA: 0.1
  BATCH_SIZE: 8
  OVERFIT_BATCHES: 0
  NUM_EPOCHS: 150
  EARLY_STOPPING: False
  MAP_EVAL_FREQ: 5

LIGHTNING:
  ACCELERATOR: 'cuda'
  PRECISION: 32
  DETERMINISTIC: False
  NUM_SANITY_VAL_STEPS: 0
  ENABLE_CHECKPOINTING: True
  ENABLE_PROGRESS_BAR: True
  ACCUMULATE_GRAD_BATCHES: 1

AUGMENTATION:
  HORIZONTAL_FLIP_PROB: 0.5
  VERTICAL_FLIP_PROB: 0.5
  ROTATION_DEGREES: 90
  BRIGHTNESS_RANGE: (0.8, 1.2)
  CONTRAST_RANGE: (0.8, 1.2)
  HUE_DELTA: 0.05
  SATURATION_RANGE: (0.8, 1.2)
  GAUSSIAN_BLUR_PROB: 0.3
  RANDOM_CROP_PROB: 0.5
  RANDOM_CROP_SCALE: (0.7, 1.0)
  NOISE_STD: 0.03
  RARE_CLASS_INDICES: [3, 5, 6, 8, 9, 10, 11, 12]
  RARE_CLASS_AUGMENT_PROB: 0.7
  COMMON_CLASS_AUGMENT_PROB: 0.2
