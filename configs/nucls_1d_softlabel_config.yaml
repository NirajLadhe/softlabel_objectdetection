DATA:
  DATASET: 'nucls'
  ROOT: '/media/klee_ro/public_datasets/nucls'
  SOFT_LABEL_FILE_1D: '../outputs/nucls/1d_gaussian_softlabels/1DGMM_softLabels_iou0_25_with_priors.json'
  HARD_LABEL_FILE: '../outputs/nucls/hard_labels/HardLabels_MajorityVote_iou0_25.json'
  GMM_TYPE: '1D'
  # 0.10: ~146 train / ~16 val — more training data, validated in Hard Run 5
  # Trade-off: smaller val set but richer training signal with soft labels
  TEST_SPLIT_RATIO: 0.15 # change to 0.15 because of ECE
  BALANCED_SAMPLER: True
  RFS_THRESHOLD: 0.25
  # NuCLS has no No Finding class — all clusters are nucleus types
  IGNORE_NOFINDING_IMAGES: False
  DOWNWEIGHT_NOFINDING_IMAGES: False
  NOFINDING_INCLUDE_FRACTION: 1.0
  OPTIONS:
    rater_weights_csv: '../outputs/nucls/reliability/annotator_reliability_scores_nucls_iou0_25.csv'
    image_extension: '.png'

MODEL:
  NUM_CLASSES: 14  # 0=background, 1=vacant(No Finding), 2-13=nucleus types
  BACKBONE: 'resnet50'
  PROBABILISTIC: True  # ProbabilisticRoIHeads — soft label head with variance prediction
  # Inverse frequency weighting — NuCLS severe class imbalance
  # tumor=40%, myoepithelium=0.03%
  ROI_HEAD_BUFFER_FREQ_TERM: 'inverse'
  # Reduced from 15.0 — prevents extreme gradient weighting for very rare classes
  # Validated in Run 5 hard labels: avoids gradient explosions
  ROI_HEAD_BUFFER_MAX_WEIGHT: 3.0
  # Anchor analysis results (89794 annotations, 162 images):
  #   Median nucleus: 33w x 32h px, aspect ratio median=1.02 (circular)
  #   K-means sizes: [41,58,77,101,134]px → [16,32,64,96,128]
  #   K-means aspects: [0.72,1.10,1.58] → [0.75,1.0,1.5]
  ANCHOR_SIZES: [[16], [32], [64], [96], [128]]
  ANCHOR_ASPECT_RATIOS: [[0.75, 1.0, 1.5]]

MISC:
  RUN_NAME: 'nucls_softlabels_1d_iou0_25_40epochs'
  RESULTS_CSV: '../outputs/nucls/training_metric_logs'
  SAVE_MODEL_PATH: '../outputs/saved_models/nucls/1d_gaussian_softlabels'
  EVALUATION_RESULTS_DIR: '../outputs/nucls/1d_gaussian_softlabels/evaluation_results'
  PRETRAINED_WEIGHTS: ''
  FROZEN_LAYERS: []
  NO_CUDA: False

TRAIN:
  # AdamW optimizer hardcoded in base_module.py (For better cconvergence with soft labels)
  # weight_decay=0.001, warmup_iters=100 also hardcoded there
  # Validated in Run 5: 10x lower than original soft config LR
  BASE_LR_BBOX: 0.0001
  BASE_LR_CLASS: 0.0001
  BASE_LR: 0.0001
  BOX_REG_LOSS_WEIGHT: 1.0
  # secondary_scheduler = CosineAnnealingLR (T_max=NUM_EPOCHS, eta_min=1e-5)
  # Note: MILESTONES and GAMMA are dead config with secondary_scheduler (TBD)
  SCHEDULER: 'secondary_scheduler'
  MILESTONES: [20, 30]
  GAMMA: 0.5
  # Increased from 4 → 8: utilizes V100 properly, smoother gradients
  BATCH_SIZE: 8
  OVERFIT_BATCHES: 0
  # Increased from 30 → 40: soft labels provide richer signal per sample
  # Monitor early stopping — may converge before epoch 40
  NUM_EPOCHS: 40
  EARLY_STOPPING: False
  # mAP computed at epoch 10, 20, 30, 40
  MAP_EVAL_FREQ: 10

LIGHTNING:
  ACCELERATOR: 'cuda'
  PRECISION: 32
  DETERMINISTIC: False
  NUM_SANITY_VAL_STEPS: 0
  ENABLE_CHECKPOINTING: False
  ENABLE_PROGRESS_BAR: True
  ACCUMULATE_GRAD_BATCHES: 1

AUGMENTATION:
  # Nuclei are rotation invariant → 90° rotation safe
  # H&E stain variation → wider color jitter
  HORIZONTAL_FLIP_PROB: 0.5
  ROTATION_DEGREES: 90
  BRIGHTNESS_RANGE: (0.8, 1.2)
  CONTRAST_RANGE: (0.8, 1.2)
  NOISE_STD: 0.03
  # Rare nucleus classes (framework ID -> class):
  # 3=mitotic_figure, 5=vascular_endothelium, 6=macrophage, 8=plasma_cell
  # 9=neutrophil, 10=eosinophil, 11=myoepithelium, 12=apoptotic_body
  RARE_CLASS_INDICES: [3, 5, 6, 8, 9, 10, 11, 12]
  # Reduced from 0.9 → 0.5: validated in Hard Run 5
  # Ensures model sees unaugmented rare cells — prevents over-augmentation
  RARE_CLASS_AUGMENT_PROB: 0.5
  COMMON_CLASS_AUGMENT_PROB: 0.3

# =============================================================================
# SOFT LABEL SPECIFIC NOTES
# =============================================================================
# Loss functions (hardcoded in ProbabilisticRoIHeads, faster_rcnn_1d.py):
#   loss_box_mean:  smooth_l1(pred_means, gt_means, beta=0.5)  * LAMBDA_MEAN(2.0)
#   loss_box_var:   smooth_l1(pred_log_stds, gt_log_stds, beta=0.5) * LAMBDA_VAR(1.0)
#   loss_classifier: soft_cross_entropy(logits, class_probs) weighted by annotation_weight * LAMBDA_CLS(1.0)
#
# annotation_weight per cluster (base.py fix applied):
#   Filters negative K-alpha raters before averaging
#   Floor: 0.01 (preserves real reliability differences)
#   Multi-rater clusters -> higher weight than single-rater
#
# Hardcoded in faster_rcnn_1d.py (Hard Run 5):
#   score_thresh = 0.1      (lowered from 0.3, improved recall significantly)
#   fg_iou_thresh = 0.5     (both RPN and RoI, aligns with mAP@50 eval)
#   rpn_bg_iou_thresh = 0.3 (ignored zone [0.3, 0.5])
#   roi_bg_iou_thresh = 0.3 (unchanged)
#   detections_per_img = 600 (avg 554 nuclei/image)
#   positive_fraction = 0.4 (ProbabilisticRoIHeads)
#   nms_thresh = 0.5        (dense nuclei legitimately overlap)
#   min_size = 400          (native NuCLS resolution)
#   max_size = 600
#
# Hardcoded in base_module.py:
#   optimizer = AdamW (weight_decay=0.001)
#   warmup_iters = 100
#
# Hardcoded in train_lightning.py:
#   gradient_clip_val = 3.0