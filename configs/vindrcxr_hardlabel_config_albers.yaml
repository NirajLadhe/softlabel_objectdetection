DATA:
  DATASET: 'VinDr-CXR'
  ROOT: '/media/klee_ro/public_datasets/vindr_cxr'
  SOFT_LABEL_FILE_1D: '../outputs/vindrcxr/1d_gaussian_softlabels/1DGMM_softLabels_iou0_5_with_priors.json'
  SOFT_LABEL_FILE_2D: '../outputs/vindrcxr/2d_gaussian_softlabels/2DGMM_softLabels_iou0_5_with_priors.json'
  HARD_LABEL_FILE: '../outputs/vindrcxr/hard_labels/HardLabels_MajorityVote_iou0_5.json'
  GMM_TYPE: 'HARD_LABEL' 
  TEST_SPLIT_RATIO: 0.2
  BALANCED_SAMPLER: True
  OVERSAMPLE_FACTOR: 0.25 # 1.0/ RFS THRESHOLD
  IGNORE_NOFINDING: False
  NOFINDING_WEIGHT_GIVEN: True

MODEL:
  NUM_CLASSES: 15
  BACKBONE: 'resnet50'
  PROBABILISTIC: False  # Standard Faster R-CNN head
  ROI_HEAD_BUFFER_FREQ_TERM: 'inverse' # Choose between "inverse", "inverse_sqrt"
  ROI_HEAD_BUFFER_MAX_WEIGHT: 15.0 # Maximum weight for the buffer
  ANCHOR_SIZES: [[32], [64], [128], [256], [512]]
  ANCHOR_ASPECT_RATIOS: [[0.33, 0.5, 0.75, 1.0, 2.0, 3.0]]

MISC:
  RUN_NAME: 'vindrcxr_hardLabel_30Epoch_iou0_5'
  RESULTS_CSV: '../outputs/training_metric_logs'
  SAVE_MODEL_PATH: '../outputs/saved_models/vindrcxr/hard_labels'
  EVALUATION_RESULTS_DIR: '../outputs/vindrcxr/hard_labels/evaluation_results'
  PRETRAINED_WEIGHTS: ''
  FROZEN_LAYERS: []
  NO_CUDA: False

TRAIN:
  BASE_LR_BBOX: 0.001
  BASE_LR_CLASS: 0.0005
  BASE_LR: 0.001
  BOX_REG_LOSS_WEIGHT: 10.0
  SCHEDULER: 'main_scheduler'
  MILESTONES: [20, 25]
  GAMMA: 0.5
  BATCH_SIZE: 4
  OVERFIT_BATCHES: 0
  NUM_EPOCHS: 30
  EARLY_STOPPING: True

AUGMENTATION:
  HORIZONTAL_FLIP_PROB: 0.5
  ROTATION_DEGREES: 10
  BRIGHTNESS_RANGE: (0.9, 1.1)
  CONTRAST_RANGE: (0.9, 1.1)
  NOISE_STD: 0.02
  RARE_CLASS_INDICES: [2, 3, 5, 6, 7, 9, 13]
  RARE_CLASS_AUGMENT_PROB: 0.7
  COMMON_CLASS_AUGMENT_PROB: 0.2